model:
  name: "ATHAR \u2014 triangulated marketing incrementality"
  version: 0.1.0
  owner: Krishna Mathur
  description: A media-mix model, a randomised-experiment analysis and an attribution model,
    reconciled against a known ground truth and priced as a budget decision.
intended_use: 'An academic demonstration, for MAIB AI 208, that platform-reported return is
  not incremental return, and a measurement of how far three standard methods sit from a truth
  none of them can see. Read by examiners and by readers of the public portfolio.


  **Out of scope:** budget decisions for any real advertiser; any claim about a named marketing
  channel''s real effectiveness; any exchange-rate or currency claim.'
data:
  source: Olist Brazilian E-Commerce (real, 96,731 orders across 85 weeks) and Criteo-UPLIFT
    v2.1 (real randomised trial, 13,979,592 rows), plus a simulated five-channel spend panel
    generated from config/dgp.yaml
  provenance: simulated
  provenance_note: Mixed, and labelled as simulated because the strictest label wins. The
    Criteo result and the Olist frame are real and carry their own artifacts; everything downstream
    of the spend panel is simulated. athar.provenance enforces the distinction on every artifact.
  window: 2017-01-02 to 2018-08-13
  configuration: config/dgp.yaml, digest d9e7b488eb749462, seed 20260829
metrics:
- name: Intent-to-treat lift (Criteo)
  value: 0.00115187
  split: full population, 13,979,592 rows, no sampling
  note: 95% CI 0.00108451 to 0.00121924. Real randomised trial.
- name: Platform-reported over incremental conversions
  value: 1.6827
  split: full population, 13,979,592 rows, no sampling
  note: Real data. The numerator conditions on exposure, which is post-treatment.
- name: Average-ROI coverage, matched fit
  value: 1.0
  split: headline panel, 85 weeks, real Olist baseline
  note: 5/5 channels inside the 89% interval; median absolute relative error 5.43. Simulated
    media.
- name: Average-ROI coverage, misspecified fit
  value: 0.6
  split: headline panel, 85 weeks, real Olist baseline
  note: 3/5 channels inside the 89% interval; median absolute relative error 0.26. Simulated
    media.
- name: Recovery-grid fits converged
  value: 21/40
  split: 40-cell factorial grid, 5 seeds per cell
  note: Fits failing the diagnostics are excluded from every coverage rate and counted here,
    rather than averaged in.
- name: BG/NBD maximum-likelihood fits that converged
  value: 0/15
  split: full Olist base, 3 time scales x 5 penalties
  note: 'Real data. A negative result: the dropout parameters are unidentified.'
- name: Holdout mean absolute error, repeat purchases
  value: 0.008527
  split: 16-week holdout to 2018-08-20
  note: 'Predicting zero scores 0.007987; beats it: False.'
- name: Cost of allocating from last-click attribution
  value: 0.3421
  split: headline panel, full budget, evaluated under the true response curves
  note: Share of achievable incremental revenue forgone. Simulated media.
limitations:
- No figure describes the effectiveness of any real marketing channel. The channel-spend panel,
  the effect sizes and the attribution bias are all constructed from a pre-registered configuration.
- The revenue baseline is treated as if it were a no-advertising counterfactual. Olist did
  market itself over 2017-18, so the real series already contains real media effects; layering
  a simulated effect on top produces a series whose simulated component has a known truth,
  which is the only claim made.
- The ordering of attribution bias across channels follows Blake, Nosko and Tadelis (2015),
  Econometrica 83(1), 155-174, who found returns to branded keyword advertising indistinguishable
  from zero. The magnitudes here are chosen, not measured.
- Currency is Brazilian reais, 2017-18. Every dirham figure is a stated scenario at a nominal
  rate and is not a measurement.
- The media-mix results are conditional on a media signal share of roughly 17% of detrended
  revenue variance on the headline panel. A quieter media plan is a harder recovery problem
  and the reported errors would grow.
- Criteo's twelve features are anonymised, so no uplift finding can be given a business interpretation,
  and they are heavily repeated, so the nominal row count overstates the precision available
  to a model fitted on them.
- 'Meridian was gated and runs on this machine, but no Meridian fit is reported: adapting
  the panel to its geo-hierarchical interface faithfully is separate work, and an unfaithful
  adaptation would be worse than none.'
- Nothing here is legal or financial advice.
