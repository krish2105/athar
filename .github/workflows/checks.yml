# What CI can honestly check, and what it cannot.
#
# The dashboard job is complete: it type-checks and builds the page from the
# committed metrics artifacts, which is the whole of that surface.
#
# The Python job is gated on a token, and is skipped by default. ATHAR depends on
# SPINE as an editable path dependency at `../01-spine`, and SPINE is a private
# repository. `actions/checkout` cannot place a repository outside the workspace,
# and cloning a private repo needs a credential this repository does not carry. So
# rather than let the job fail and leave a red badge that means nothing, it runs
# only when a `SPINE_TOKEN` secret exists.
#
# Until then, `make lint` and `make test` are the local gate, and the README says
# so. Making SPINE public, or adding the secret, turns this on with no other
# change.

name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      spine: ${{ steps.check.outputs.spine }}
    steps:
      - id: check
        env:
          SPINE_TOKEN: ${{ secrets.SPINE_TOKEN }}
        run: echo "spine=${{ env.SPINE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  python:
    needs: gate
    if: needs.gate.outputs.spine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: athar
      - uses: actions/checkout@v4
        with:
          repository: krish2105/spine
          token: ${{ secrets.SPINE_TOKEN }}
          path: spine
      - name: Put SPINE where the path dependency expects it
        run: mv spine "$(dirname "$GITHUB_WORKSPACE")/01-spine" || mv spine ../01-spine
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - working-directory: athar
        run: uv sync --all-extras
      - working-directory: athar
        run: uv run ruff check .
      - working-directory: athar
        run: uv run ruff format --check .
      - working-directory: athar
        run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - name: The build must not have changed the committed page
        run: git diff --exit-code ../docs
