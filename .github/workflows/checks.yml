# Lint, test, and build the page.
#
# The Python job clones SPINE alongside the checkout, because ATHAR consumes it
# as an editable path dependency at `../01-spine` and `actions/checkout` cannot
# place a repository outside the workspace. Both repositories are checked out
# into siblings under the workspace parent, which reproduces the layout the
# README describes.
#
# What CI does not run is `make all`: the pipeline reads Olist and Criteo from a
# shared store outside the repository which is not redistributable, and forty
# full-posterior fits are not a CI job. It checks that the library is clean, the
# tests pass, and the committed page still matches its source.

name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: 03-athar
      - uses: actions/checkout@v4
        with:
          repository: krish2105/spine
          path: 01-spine
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync, with SPINE as a sibling
        working-directory: 03-athar
        run: uv sync --all-extras
      - working-directory: 03-athar
        run: uv run ruff check .
      - working-directory: 03-athar
        run: uv run ruff format --check .
      - working-directory: 03-athar
        run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - name: The build must not have changed the committed page
        run: git diff --exit-code ../docs
