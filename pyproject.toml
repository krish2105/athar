[project]
name = "athar"
version = "0.1.0"
description = "Triangulated marketing incrementality: MMM, uplift, CLV and budget allocation, reconciled."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Krishna Mathur" }]
dependencies = [
    "spine",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    # The Criteo file is 3.2 GB of CSV. DuckDB scans it out-of-core to compute the
    # full-population treatment effect and to write the Parquet every downstream
    # read uses; pandas never sees the CSV.
    "duckdb>=1.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "jupyter>=1.1",
    "nbconvert>=7",
]

[project.optional-dependencies]
# Kept out of the default sync deliberately. Each of these three has a distinct
# failure mode on arm64, and a broken optional extra must not stop the core
# pipeline from installing. Each is gated by a script in scripts/ that records
# what happened rather than letting the failure disappear.
mmm = ["pymc-marketing>=0.9", "arviz>=0.18"]
causal = ["econml>=0.15", "causalml>=0.15"]
meridian = ["google-meridian>=1.0"]
# lifetimes is unmaintained and predates NumPy 2. It is kept because it is the
# reference MLE implementation of BG/NBD, and agreement between it and
# pymc-marketing's Bayesian fit is a real cross-implementation check rather than
# a model checking itself. The Bayesian fit is what the report quotes, because
# this project's conventions require intervals.
clv = ["lifetimes>=0.11"]
all = ["athar[mmm,causal,meridian,clv]"]

[tool.uv.sources]
spine = { path = "../01-spine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athar"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
# D203/D213: conflict with the numpy convention selected below.
# D401: a metric's summary line should name the quantity it returns, not command
#       the reader. Kept consistent with SPINE and ADIL.
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103"]
"scripts/*" = ["D103"]
# A helper defined in a notebook cell to keep that cell readable is not public
# API; the cell's own markdown says what it does. Everything in src/ still needs
# a docstring.
"notebooks/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
# src/athar is a testpath so the worked example in every docstring runs as a
# doctest. An example that drifts from its code fails the suite.
testpaths = ["tests", "src/athar"]
addopts = "-q --cov=athar --cov-report=term-missing --doctest-modules"
# pymc-marketing 0.19.2 deprecates the MMM class in favour of a multidimensional
# one that provides neither of the contribution-extraction methods this project
# needs. The version is pinned, the choice is documented in src/athar/mmm.py, and
# the notice is silenced here so it does not bury the test output.
filterwarnings = [
    "ignore:.*MMM class is deprecated.*:DeprecationWarning",
    "ignore:.*multidimensional.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["athar"]
